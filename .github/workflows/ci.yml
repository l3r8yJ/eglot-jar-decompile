name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jcs090218/setup-emacs@master
        with:
          version: 31.1
      - run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ["29.1", "30.1", "31.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: make compile test

  test-lsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jcs090218/setup-emacs@master
        with:
          version: 31.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install lsp-mode
        run: |
          emacs -Q --batch --eval "(progn (setq package-user-dir \"$PWD/.elpa\") (require 'package) (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t) (package-initialize) (package-refresh-contents) (package-install 'lsp-mode))"
      - name: Run suite with lsp-mode
        run: |
          emacs -Q --batch --eval "(progn (setq package-user-dir \"$PWD/.elpa\") (require 'package) (package-initialize))" -L . -L test -l test/eglot-jar-decompile-test.el -f ert-run-tests-batch-and-exit
